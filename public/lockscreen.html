<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7665b8">
<title>Markchan · 捡手机</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;color:#fff}body{background:#111;display:grid;place-items:center}.phone{position:relative;width:min(100vw,393px);height:min(100dvh,852px);min-height:560px;overflow:hidden;border-radius:44px;background:linear-gradient(160deg,#d6c6f2 0%,#a99bdc 38%,#7666b7 70%,#39375e 100%);box-shadow:0 20px 70px #0008}.wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 18% 25%,#f7e9ff9c,transparent 34%),radial-gradient(ellipse at 85% 62%,#d6c6ff75,transparent 35%),linear-gradient(160deg,#c7b7ef,#8b80c9 54%,#424365);transition:filter .3s}.status{position:absolute;top:17px;left:27px;right:27px;display:flex;justify-content:space-between;font-size:14px;font-weight:650;z-index:2}.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:22px;background:#101014;z-index:3}.sys{display:flex;gap:5px;align-items:center}.signal{font-size:12px;letter-spacing:-2px}.lock{position:absolute;inset:0;z-index:1;text-align:center}.lockmark{margin-top:91px;font-size:22px;text-shadow:0 1px 8px #35265b44}.date{font-size:19px;font-weight:550;margin-top:10px;text-shadow:0 1px 8px #35265b44}.time{font-size:clamp(78px,24vw,100px);font-weight:650;letter-spacing:-5px;line-height:1.1;margin-top:0;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px #35265b26}.hint{position:absolute;bottom:92px;left:0;right:0;font-size:14px;animation:pulse 2.4s infinite;text-shadow:0 1px 8px #35265b44}.tools{position:absolute;bottom:38px;left:44px;right:44px;display:flex;justify-content:space-between}.tool{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#17162955;backdrop-filter:blur(12px);font-size:22px}.change{position:absolute;top:57px;right:18px;font-size:11px;color:#fff;border:1px solid #ffffff55;border-radius:18px;padding:7px 10px;background:#ffffff18;z-index:4}.pin,.home{position:absolute;inset:0;z-index:5;display:none;text-align:center;background:#29283c38;backdrop-filter:blur(22px);padding:76px 24px 28px}.pin h2{font-size:22px;font-weight:550;margin:14px 0 22px}.dots{display:flex;justify-content:center;gap:17px;margin-bottom:28px}.dots i{width:12px;height:12px;border:1.5px solid #fff;border-radius:50%}.dots i.f{background:white}.keys{width:260px;max-width:100%;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 15px}.key{height:68px;border-radius:50%;background:#ffffff2d;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;color:#fff;font-size:29px}.key small{font-size:9px;letter-spacing:2px;min-height:10px}.error{height:22px;margin-top:15px;font-size:13px;color:#fff3b0}.cancel{position:absolute;bottom:35px;left:30px;background:none;border:0;color:white;font-size:15px}.home{padding:74px 20px 30px;background:linear-gradient(155deg,#b7a5df,#5d5d89);backdrop-filter:none}.home h2{font-size:26px;margin:20px 0 35px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 8px}.app{font-size:12px;display:flex;flex-direction:column;align-items:center;gap:7px}.ico{width:56px;height:56px;border-radius:15px;background:#ffffffd9;color:#514c70;display:grid;place-items:center;font-size:27px;box-shadow:0 3px 12px #2222}.dock{position:absolute;bottom:25px;left:15px;right:15px;border-radius:27px;background:#ffffff40;display:flex;justify-content:space-around;padding:12px}.dock .ico{width:49px;height:49px}@keyframes pulse{50%{opacity:.55;transform:translateY(-3px)}}@media(min-width:430px){.phone{border:5px solid #26262c}}@media(max-height:650px){.lockmark{margin-top:62px}.time{font-size:76px}.pin{padding-top:35px}.keys{gap:8px 12px}.key{height:56px}}
</style>
</head>
<body>
<div class="phone" id="phone">
<div class="wallpaper" id="wallpaper"></div><div class="island"></div>
<div class="status"><span>21:14</span><span class="sys"><span class="signal">▂▄▆</span> Wi-Fi ▰</span></div>
<button class="change" id="change">更换壁纸</button>
<section class="lock" id="lock">
<div class="lockmark">♙</div><div class="date">10月29日 星期四</div><div class="time">21:14</div>
<div class="hint" id="unlockHint">⌃　上滑以解锁</div>
<div class="tools"><div class="tool">◉</div><div class="tool">📷</div></div>
</section>
<section class="pin" id="pin">
<div style="font-size:24px">🔒</div><h2>输入密码</h2><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
<div class="keys" id="keys"></div><div class="error" id="error" role="status"></div><button class="cancel" id="cancel">取消</button>
</section>
<section class="home" id="home">
<div style="font-size:13px;text-align:left;opacity:.9">21:14　　●●●　▰</div><h2>Markchan's iPhone</h2>
<div class="grid">
<div class="app"><div class="ico">🎵</div>Music</div><div class="app"><div class="ico">🧭</div>Safari</div><div class="app"><div class="ico">🎙️</div>录音机</div><div class="app"><div class="ico">💬</div>KakaoTalk</div>
<div class="app"><div class="ico">⚙️</div>设置</div><div class="app"><div class="ico">📝</div>备忘录</div><div class="app"><div class="ico">𝕏</div>X</div><div class="app"><div class="ico">📸</div>Instagram</div>
<div class="app"><div class="ico">🗺️</div>地图</div><div class="app"><div class="ico">🌤️</div>天气</div><div class="app"><div class="ico">🖼️</div>照片</div><div class="app"><div class="ico">❤️</div>倒数日</div>
<div class="app"><div class="ico">📅</div>日历</div><div class="app"><div class="ico">🕒</div>时间</div>
</div><div class="dock"><div class="ico">🖼️</div><div class="ico">🎵</div><div class="ico">🧭</div><div class="ico">💬</div></div>
</section>
</div>
<script>
const lock=document.getElementById('lock'),pin=document.getElementById('pin'),home=document.getElementById('home'),dots=[...document.querySelectorAll('#dots i')],error=document.getElementById('error');let code='',startY=0;
function showPin(){lock.style.display='none';pin.style.display='block';code='';paint();error.textContent=''}
function paint(){dots.forEach((d,i)=>d.classList.toggle('f',i<code.length))}
function press(n){if(n==='⌫')code=code.slice(0,-1);else if(code.length<4)code+=n;paint();error.textContent='';if(code.length===4){if(code==='8266'){pin.style.display='none';home.style.display='block';document.getElementById('change').style.display='none'}else{error.textContent='密码不正确，请重试';setTimeout(()=>{code='';paint()},450)}}}
const keys=document.getElementById('keys');['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(n=>{const b=document.createElement(n?'button':'span');if(n){b.className='key';b.innerHTML=n==='⌫'?'⌫':n+(Number(n)>1&&Number(n)<10?'<small>'+({'2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO','7':'PQRS','8':'TUV','9':'WXYZ'}[n]||'')+'</small>':'');b.onclick=()=>press(n)}keys.appendChild(b)});
document.getElementById('unlockHint').onclick=showPin;document.getElementById('phone').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});document.getElementById('phone').addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>35&&lock.style.display!=='none')showPin()},{passive:true});document.getElementById('cancel').onclick=()=>{pin.style.display='none';lock.style.display='block';code='';paint()};document.getElementById('change').onclick=()=>{const w=document.getElementById('wallpaper');w.style.filter=w.style.filter?'':'hue-rotate(70deg) saturate(1.2)'};document.getElementById('phone').addEventListener('keydown',e=>{if(/^\d$/.test(e.key))press(e.key);if(e.key==='Backspace')press('⌫')});
</script>
</body>
</html>
